name: Instagram 自動投稿

on:
  schedule:
    - cron: "*/15 * * * *"     # 15分ごとに確認（GitHub の混雑で数分〜十数分遅れることがあります）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テストのみ（公開しない）"
        type: boolean
        default: true
      only:
        description: "この投稿IDだけを今すぐ公開（空欄なら時刻どおり）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 投稿する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
            if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          fi
          python scripts/publish.py $ARGS
      - name: 結果を記録する
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add posted
          git diff --cached --quiet || (git commit -m "投稿結果を記録" && git push)
